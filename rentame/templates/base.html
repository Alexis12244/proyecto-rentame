<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Réntame</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        body {
            background-color: #f5f3ef;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: transparent;
            padding: 20px;
        }

        .btn-green {
            background-color: #2f5d3a;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-green:hover {
            background-color: #244a2e;
            color: white;
            text-decoration: none;
        }

        .title-main {
            font-size: 3rem;
            font-weight: bold;
            color: #2f5d3a;
        }

        .card-cabana {
            border-radius: 20px;
            overflow: hidden;
            background: white;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.05);
        }

        .price {
            color: #2f5d3a;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #calendario {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.05);
        }

        .fc-toolbar-title {
            color: #2f5d3a;
            font-weight: bold;
        }

        .fc-button {
            background-color: #2f5d3a !important;
            border: none !important;
            border-radius: 10px !important;
        }

        .fc-button:hover {
            background-color: #244a2e !important;
        }

        .fc-daygrid-day:hover {
            background-color: #f0f7f2;
            cursor: pointer;
        }

        .fc-day-today {
            background-color: #e6f4ea !important;
        }

        .fc-event {
            background-color: #ff4d4d !important;
            border: none !important;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>

</head>

<body>

<nav class="navbar d-flex justify-content-between align-items-center">

    <h3 class="title-main">🏡 Réntame</h3>

    <div class="d-flex gap-2 align-items-center">

        <a href="/" class="btn-green">Inicio</a>
        <a href="/lista-cabanas/" class="btn-green">Cabañas</a>
        <a href="/comunidad/" class="btn-green">Comunidad</a>
        <a href="/contacto/" class="btn-green">Contacto</a>

        {% if user.is_authenticated %}

            <a href="/mis-reservas/" class="btn-green">
                Mis reservas
            </a>

            <span class="fw-bold">
                👤 {{ user.username }}
            </span>

            <a href="/usuarios/logout/" class="btn-green">
                Cerrar sesión
            </a>

        {% else %}

            <a href="/usuarios/login/" class="btn-green">
                Login
            </a>

            <a href="/usuarios/registro/" class="btn-green">
                Registro
            </a>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
