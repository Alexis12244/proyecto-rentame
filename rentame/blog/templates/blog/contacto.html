{% extends 'base.html' %}

{% block content %}

<h2>Contacto</h2>

{% if enviado %}
<p>Mensaje enviado correctamente ✅</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <textarea name="mensaje" class="form-control"></textarea>
    <br>
    <button class="btn btn-green">Enviar</button>
</form>

{% endblock %}
